# ── Lendsphera Legacy Bridge — full nginx site config ───────────────
# Included by the docker-compose.legacy.yml overlay.

# Landing-ID map generated by generate-nginx-map.ts
include /etc/nginx/conf.d/ls-landing-map.conf;

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass  legacy-php:9000;
        fastcgi_index index.php;

        include       fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # ── Bridge params ────────────────────────────────────────
        fastcgi_param LS_LANDING_ID  $ls_landing_id;
        fastcgi_param LS_API_URL     "${LS_API_URL}";
        fastcgi_param LS_BRIDGE_KEY  "${LS_BRIDGE_KEY}";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires    30d;
        add_header Cache-Control "public, immutable";
    }
}
