name: visual

on:
  pull_request:
    paths:
      - "packages/widgets/**"
      - ".github/workflows/visual.yml"
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Run visuals
        run: pnpm visual

      - name: Upload snapshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widgets-visual-artifacts
          path: |
            packages/widgets/test-results
            packages/widgets/tests/visual/__snapshots__
          if-no-files-found: ignore
