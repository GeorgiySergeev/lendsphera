name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: landing_builder_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 9000:9000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @workspace/api prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/landing_builder_test

      - name: Seed test data
        run: pnpm --filter @workspace/api prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/landing_builder_test

      - name: Build applications
        run: pnpm build

      - name: Start API server
        run: pnpm --filter @workspace/api dev &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/landing_builder_test
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          PORT: 4000

      - name: Start web server
        run: pnpm --filter @workspace/web dev &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Wait for servers
        run: |
          npx wait-on http://localhost:4000/health http://localhost:3002 --timeout 120000

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          BASE_URL: http://localhost:3002
          API_URL: http://localhost:4000
          TEST_USER_EMAIL: test@example.com
          TEST_USER_PASSWORD: testpass123

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
