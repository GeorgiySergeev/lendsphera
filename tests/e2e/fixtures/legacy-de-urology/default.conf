include /etc/nginx/conf.d/ls-landing-map.conf;

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass legacy-php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param LS_LANDING_ID $ls_landing_id;
        fastcgi_param LS_API_URL "http://host.docker.internal:54000/api";
        fastcgi_param LS_BRIDGE_KEY "dev-ls-bridge-key-change-me";
        fastcgi_param LS_BRIDGE_HMAC_SECRET "dev-ls-bridge-hmac-secret-change-me";
    }
}